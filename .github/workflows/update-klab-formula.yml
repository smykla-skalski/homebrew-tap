name: Update Formula

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update to (e.g., 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-formula:
    name: Update klab formula
    runs-on: macos-latest

    steps:
      - name: Generate Homebrew Tap GitHub App token
        id: homebrew-tap-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ vars.SMYKLOT_APP_ID }}
          private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}
          owner: smykla-skalski
          repositories: homebrew-tap

      - name: Checkout tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Generate GitHub App token
        id: github-app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ vars.SMYKLOT_APP_ID }}
          private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}
          owner: smykla-skalski
          repositories: klab

      - name: Set version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$PAYLOAD_VERSION"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Updating to version: ${VERSION}"

      - name: Download release artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.github-app-token.outputs.token }}
        run: |
          gh release download "v${VERSION}" \
            --repo smykla-skalski/klab \
            --pattern "klab-darwin-arm64.tar.gz"

      - name: Calculate SHA256
        id: sha256
        run: |
          SHA256=$(shasum -a 256 klab-darwin-arm64.tar.gz | awk '{print $1}')
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "SHA256: ${SHA256}"

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          # Update version
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Formula/klab.rb

          # Update URL (matches any version format: 1.0.0, 1.0.0-test, 1.0.0-alpha.1, etc.)
          sed -i '' "s|/v[^/]*/klab-darwin-arm64.tar.gz|/v${VERSION}/klab-darwin-arm64.tar.gz|" Formula/klab.rb

          # Update SHA256 (handle placeholder case)
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Formula/klab.rb

          echo "Updated formula:"
          cat Formula/klab.rb

      - name: Commit
        env:
          GH_TOKEN: ${{ steps.homebrew-tap-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git diff --quiet -- Formula/klab.rb && exit 0
          gh api graphql \
            -f query='mutation($repo: String!, $branch: String!, $head: GitObjectID!, $headline: String!, $body: String!, $contents: Base64String!) {
              createCommitOnBranch(input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch}
                expectedHeadOid: $head
                message: {headline: $headline, body: $body}
                fileChanges: {additions: [{path: "Formula/klab.rb", contents: $contents}]}
              }) { commit { url } }
            }' \
            -f repo="${GITHUB_REPOSITORY}" \
            -f branch=main \
            -f head="$(git rev-parse HEAD)" \
            -f headline="chore(formula): update klab to v${VERSION}" \
            -f body="Automated update triggered by klab release v${VERSION}" \
            -f contents="$(base64 < Formula/klab.rb | tr -d '\n')" \
            --jq .data.createCommitOnBranch.commit.url
