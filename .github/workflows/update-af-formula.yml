name: Update af Formula

on:
  repository_dispatch:
    types: [af-release]
  workflow_dispatch:
    inputs:
      version:
        description: Version to update to (for example 0.8.110)
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-formula:
    name: Update af formula
    runs-on: macos-latest

    steps:
      - name: Generate Homebrew Tap GitHub App token
        id: homebrew-tap-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.SMYKLOT_APP_ID }}
          private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}
          owner: smykla-skalski
          repositories: homebrew-tap

      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$PAYLOAD_VERSION"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "v${VERSION}" \
            --repo smykla-skalski/af \
            --pattern "af_${VERSION}_darwin_amd64.tar.gz" \
            --pattern "af_${VERSION}_darwin_arm64.tar.gz" \
            --pattern "af_${VERSION}_linux_amd64.tar.gz" \
            --pattern "af_${VERSION}_linux_arm64.tar.gz"

      - name: Calculate checksums
        id: sha
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "darwin_amd64=$(shasum -a 256 "af_${VERSION}_darwin_amd64.tar.gz" | awk '{print $1}')"
            echo "darwin_arm64=$(shasum -a 256 "af_${VERSION}_darwin_arm64.tar.gz" | awk '{print $1}')"
            echo "linux_amd64=$(shasum -a 256 "af_${VERSION}_linux_amd64.tar.gz" | awk '{print $1}')"
            echo "linux_arm64=$(shasum -a 256 "af_${VERSION}_linux_arm64.tar.gz" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Rewrite formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_DARWIN_AMD64: ${{ steps.sha.outputs.darwin_amd64 }}
          SHA_DARWIN_ARM64: ${{ steps.sha.outputs.darwin_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.sha.outputs.linux_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
        run: |
          cat > Formula/af.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          class Af < Formula
            desc "Afrael's CLI tool"
            homepage "https://github.com/smykla-skalski/af"
            license "MIT"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/smykla-skalski/af/releases/download/v${VERSION}/af_${VERSION}_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"
              end
              if Hardware::CPU.arm?
                url "https://github.com/smykla-skalski/af/releases/download/v${VERSION}/af_${VERSION}_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
            end

            on_linux do
              if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "https://github.com/smykla-skalski/af/releases/download/v${VERSION}/af_${VERSION}_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"
              end
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://github.com/smykla-skalski/af/releases/download/v${VERSION}/af_${VERSION}_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
            end

            def install
              bin.install "af"
              bash_completion.install "completions/af.bash" => "af"
              fish_completion.install "completions/af.fish"
              zsh_completion.install "completions/_af"
              man1.install "af.1"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/af --version")
            end
          end
          EOF

      - name: Validate formula
        env:
          RUN_ID: ${{ github.run_id }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          temp_tap="codex-local/af-validation-${RUN_ID}"
          cleanup() {
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_FROM_API=1 brew uninstall "${temp_tap}/af" >/dev/null 2>&1 || true
            brew untap "${temp_tap}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          brew tap-new "${temp_tap}"
          cp Formula/af.rb "$(brew --repository "${temp_tap}")/Formula/af.rb"

          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_FROM_API=1 brew audit --strict "${temp_tap}/af"
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_FROM_API=1 brew install "${temp_tap}/af"

          actual_version="$("$(brew --cellar af)/${VERSION}/bin/af" --version | awk '{print $2}')"
          test "$actual_version" = "$VERSION"

      - name: Commit
        env:
          GH_TOKEN: ${{ steps.homebrew-tap-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git diff --quiet -- Formula/af.rb && exit 0
          gh api graphql \
            -f query='mutation($repo: String!, $branch: String!, $head: GitObjectID!, $headline: String!, $body: String!, $contents: Base64String!) {
              createCommitOnBranch(input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch}
                expectedHeadOid: $head
                message: {headline: $headline, body: $body}
                fileChanges: {additions: [{path: "Formula/af.rb", contents: $contents}]}
              }) { commit { url } }
            }' \
            -f repo="${GITHUB_REPOSITORY}" \
            -f branch=main \
            -f head="$(git rev-parse HEAD)" \
            -f headline="chore(formula): update af to v${VERSION}" \
            -f body="Automated update triggered by af release v${VERSION}" \
            -f contents="$(base64 < Formula/af.rb | tr -d '\n')" \
            --jq .data.createCommitOnBranch.commit.url
